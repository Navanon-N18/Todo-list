<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="=UTF-8">
        <title>My Todo List</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>My Todo List</h1>
            <div class="input-row">
                <div class="filter-row">
                <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
                <button class="filter-btn" data-filter="active">ยังไม่เสร็จ</button>
                <button class="filter-btn" data-filter="completed">เสร็จแล้ว</button>
            </div>
                <input type="text" id="todo-input" placeholder="เพิ่มรายการ...">
                <button id ="add-btn">Add</button>
            </div>
            <ul id="todo-list"></ul>
        </div>
        <script src="script.js"></script>
    </body>
</html>
